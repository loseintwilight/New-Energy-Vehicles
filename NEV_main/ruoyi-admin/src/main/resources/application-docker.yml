# Docker 环境配置 — 覆盖本地开发配置
spring:
  datasource:
    druid:
      master:
        url: jdbc:mysql://mysql:3306/new_energy?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASSWORD:changeme}
  data:
    redis:
      host: redis
      port: 6379
      password:

# 文件上传路径
ruoyi:
  profile: /home/nev/uploadPath

# MinIO 对象存储
minio:
  endpoint: http://minio:9000
  publicEndpoint: /minio-files
  accessKey: ${MINIO_ACCESS_KEY:changeme}
  secretKey: ${MINIO_SECRET_KEY:changeme}
  bucketName: newenergy