services:
  # ============================================
  # 1. MySQL 数据库
  # ============================================
  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.0
    container_name: nev-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-666666}
      MYSQL_DATABASE: new_energy
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/new_energy.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-666666}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nev-net

  # ============================================
  # 2. Redis 缓存
  # ============================================
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/library/redis:7-alpine
    container_name: nev-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nev-net

  # ============================================
  # 3. MinIO 对象存储
  # ============================================
  minio:
    image: registry.cn-hangzhou.aliyuncs.com/minio/minio:latest
    container_name: nev-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # Web 控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nev-net

  # MinIO 初始化 — 创建 bucket
  minio-init:
    image: registry.cn-hangzhou.aliyuncs.com/minio/mc:latest
    container_name: nev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/newenergy;
      mc anonymous set download local/newenergy;
      echo 'MinIO bucket newenergy ready';
      "
    networks:
      - nev-net

  # ============================================
  # 4. Spring Boot 后端
  # ============================================
  backend:
    build:
      context: ./NEV_main
      dockerfile: Dockerfile
    image: nev-backend:latest
    container_name: nev-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: druid,docker
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-666666}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/home/nev/uploadPath
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nev-net

  # ============================================
  # 5. Nginx（PC管理端 + H5 + API代理）
  # ============================================
  nginx:
    image: registry.cn-hangzhou.aliyuncs.com/library/nginx:alpine
    container_name: nev-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # PC管理端 — 先本地构建: cd NEV_main/ruoyi-ui && npm run build:prod
      - ./NEV_main/ruoyi-ui/dist:/usr/share/nginx/html/pc
      # H5移动端 — 先本地构建 uni-app
      - ./NEV-APP/unpackage/dist/build/h5:/usr/share/nginx/html/h5
    depends_on:
      - backend
    networks:
      - nev-net

# ============================================
# 数据卷
# ============================================
volumes:
  mysql-data:
  redis-data:
  minio-data:
  upload-data:

# ============================================
# 网络
# ============================================
networks:
  nev-net:
    driver: bridge