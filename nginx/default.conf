# ============================================
# NEV 项目 Nginx 配置
# ============================================
server {
    listen 80;
    server_name _;

    # 日志
    access_log /var/log/nginx/nev-access.log;
    error_log  /var/log/nginx/nev-error.log;

    # ============================================
    # PC 管理端 (ruoyi-ui)
    # ============================================
    location / {
        root   /usr/share/nginx/html/pc;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # H5 移动端
    # ============================================
    location /h5/ {
        alias /usr/share/nginx/html/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ============================================
    # 后端 API 代理
    # ============================================
    location /dev-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 上传文件访问
    # ============================================
    location /profile/ {
        proxy_pass http://backend:8080/profile/;
        proxy_set_header Host $host;
    }

    # ============================================
    # MinIO 对象存储（图片等静态资源）
    # ============================================
    location /minio-files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Swagger / SpringDoc
    # ============================================
    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }
}